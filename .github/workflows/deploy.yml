name: Deploy to Kubero

on:
  workflow_run:
    workflows: ["Docker Build"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy-kubero:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy en Kubero
        # 401: token inválido o vencido; 403: sin permisos en el pipeline;
        # 404: el pipeline o la app no coinciden. Cualquiera de ellos deja la
        # Web sin la imagen nueva, así que el job falla.
        env:
          KUBERO_TOKEN: ${{ secrets.KUBERO_TOKEN }}
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X GET \
            "https://kubero.inf.uct.cl/api/apps/ceretime/production/ceretime/restart" \
            -H "Authorization: Bearer $KUBERO_TOKEN")
          echo "Kubero respondió $code."
          if [ "$code" != "200" ]; then
            echo "::error::Kubero no aceptó el reinicio (HTTP $code)."
            exit 1
          fi
