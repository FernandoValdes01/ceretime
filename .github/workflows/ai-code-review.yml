name: AI Code Review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Revisión informativa de IA
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      R2D2_APP_CONFIGURED: ${{ secrets.R2D2_APP_ID != '' && secrets.R2D2_APP_PRIVATE_KEY != '' }}
      REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Descargar el commit de la PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Preparar Bun para leer la configuración YAML
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Comprobar la escala de 0 a 5 sin publicar reviews simuladas
        run: node .github/ai-review-scale.cjs

      - name: Autenticar como R2D2 cuando la App esté configurada
        id: r2d2_token
        if: env.R2D2_APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.R2D2_APP_ID }}
          private-key: ${{ secrets.R2D2_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write
          permission-statuses: write

      - name: Invalidar la revisión anterior y preparar instrucciones
        id: prepare
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ steps.r2d2_token.outputs.token || github.token }}
          script: |
            const { prepareReview } = require('./.github/ai-review-score.cjs');
            await prepareReview({ github, context, core });

      - name: Revisar el cambio con Groq
        id: ai_review
        if: steps.prepare.outputs.current == 'true' && steps.prepare.outputs.mode == 'single'
        continue-on-error: true
        uses: mara-werils/ai-code-reviewer@2f6bb8c98d791de5b84dc425eacadcf0a7052fcf
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        with:
          github_token: ${{ steps.r2d2_token.outputs.token || github.token }}
          provider: groq
          model: openai/gpt-oss-120b
          language: es
          review_style: minimal
          max_comments: "5"
          auto_summarize: "true"
          suggest_tests: "true"
          label_pr: "false"
          custom_instructions: ${{ steps.prepare.outputs.instructions }}

      - name: Revisar todos los bloques y agregar la evaluación de confianza
        id: confidence
        if: steps.prepare.outputs.current == 'true' && (steps.prepare.outputs.mode == 'chunked' || steps.ai_review.outcome == 'success')
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REVIEW_MODE: ${{ steps.prepare.outputs.mode }}
          REVIEW_INSTRUCTIONS: ${{ steps.prepare.outputs.chunk_instructions }}
          REVIEW_OUTCOME: ${{ steps.ai_review.outcome }}
          REVIEW_SUMMARY: ${{ steps.ai_review.outputs.summary }}
          REVIEW_RISK: ${{ steps.ai_review.outputs.risk_level }}
          REVIEW_COMMENTS: ${{ steps.ai_review.outputs.comments_count }}
          REVIEW_COVERAGE: ${{ steps.prepare.outputs.coverage }}
        with:
          github-token: ${{ steps.r2d2_token.outputs.token || github.token }}
          script: |
            const { normalizeConfidence } = require('./.github/ai-review-confidence.cjs');
            await normalizeConfidence({ core, github, context });

      - name: Retirar resúmenes históricos de GitHub Actions
        if: ${{ always() && !cancelled() && steps.r2d2_token.outcome == 'success' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { archiveReviewSummaries } = require('./.github/ai-review-score.cjs');
            await archiveReviewSummaries({ github, context, botLogin: 'github-actions[bot]' });

      - name: Publicar resumen y status del SHA revisado
        if: ${{ always() && !cancelled() }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEW_OUTCOME: ${{ steps.prepare.outputs.mode == 'chunked' && steps.confidence.outcome || (steps.confidence.outcome == 'failure' && 'failure' || steps.ai_review.outcome) }}
          REVIEW_SUMMARY: ${{ steps.confidence.outputs.summary }}
          ACTION_SUMMARY: ${{ steps.ai_review.outputs.summary }}
          REVIEW_DIFF_SIZE: ${{ steps.prepare.outputs.diff_size }}
          REVIEW_FILES_COUNT: ${{ steps.prepare.outputs.files_count }}
          REVIEW_MODE: ${{ steps.prepare.outputs.mode }}
          REVIEW_RISK: ${{ steps.confidence.outputs.risk || steps.ai_review.outputs.risk_level }}
          REVIEW_COMMENTS: ${{ steps.confidence.outputs.comments || steps.ai_review.outputs.comments_count }}
          REVIEW_BOT_LOGIN: ${{ steps.r2d2_token.outputs.app-slug && format('{0}[bot]', steps.r2d2_token.outputs.app-slug) || 'github-actions[bot]' }}
          REVIEW_COST: ${{ steps.ai_review.outputs.cost_usd }}
          REVIEW_COVERAGE: ${{ steps.confidence.outputs.coverage || steps.prepare.outputs.coverage }}
        with:
          github-token: ${{ steps.r2d2_token.outputs.token || github.token }}
          script: |
            const { publishReview } = require('./.github/ai-review-score.cjs');
            await publishReview({ github, context, core });
