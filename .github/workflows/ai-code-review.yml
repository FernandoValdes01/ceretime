name: OpenRouter isolated smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Test real review and conversation requests
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const assert = require('node:assert/strict');
            const directory = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'r2d2-smoke-'));
            const files = {"ai-review-score.cjs": "", "ai-review-confidence.cjs": "", "ai-review-presentation.cjs": "", "ai-review-scale.cjs": "", "ai-review-chunks.cjs": "", "ai-review-conversation.cjs": "", "ai-review-demo.cjs": "", "ai-review-memory.cjs": "", "ai-review-selection.cjs": "", "ai-review-context.cjs": "", "ai-review-provider.cjs": ""};
            for (const [name, data] of Object.entries(files)) fs.writeFileSync(path.join(directory, name), Buffer.from(data, 'base64'));
            const { buildPlan, reviewPlan } = require(path.join(directory, 'ai-review-chunks.cjs'));
            const { respondToInline, BOT } = require(path.join(directory, 'ai-review-conversation.cjs'));
            const { MODEL, ENDPOINT } = require(path.join(directory, 'ai-review-provider.cjs'));
            assert.ok(process.env.OPENROUTER_API_KEY, 'Missing Actions secret');
            let httpCalls = 0;
            const fetchImpl = async (url, options) => {
              assert.equal(url, 'https://openrouter.ai/api/v1/chat/completions');
              httpCalls++;
              const response = await fetch(url, options);
              core.info(`OpenRouter request ${httpCalls}: HTTP ${response.status}`);
              return response;
            };
            const sha = 'a'.repeat(40);
            const plan = buildPlan([{ filename:'example.ts', status:'added', additions:1, deletions:0, patch:'@@ -0,0 +1 @@\n+export const sum = (a: number, b: number) => a + b;' }], {}, sha);
            const report = await reviewPlan({ plan, instructions:'Review this standalone pure addition function. No external requirements or dependencies. Report only introduced functional defects.', apiKey: process.env.OPENROUTER_API_KEY, fetchImpl, sleep:async () => {}, onProgress: message => core.info(message) });
            assert.equal(report.coverage, 'complete', JSON.stringify(report.reasons));
            assert.ok(report.usage.measuredCalls > 0, 'No completed real model call');
            core.info(`Real chunk review: complete, score ${report.score}/5, calls ${report.calls}`);
            const pr={number:1,title:'Synthetic smoke test',body:'Addition function',state:'open',draft:false,base:{ref:'main'},head:{sha,repo:{full_name:'synthetic/test'}}};
            const root={id:1,body:'The sum function appears to subtract instead of adding.',path:'example.ts',line:1,side:'RIGHT',diff_hunk:'@@ -0,0 +1 @@\n+export const sum = (a: number, b: number) => a + b;',original_commit_id:sha,user:{login:BOT,type:'Bot'}};
            const reply={id:2,in_reply_to_id:1,body:'The function uses a + b. Please check the finding against this code.',user:{login:'developer',type:'User'},author_association:'MEMBER'};
            const comments=[root,reply];
            const posted=[];
            const fakeGithub={paginate:async()=>comments,rest:{pulls:{get:async()=>({data:pr}),listReviewComments:()=>{},createReplyForReviewComment:async payload=>posted.push(payload)},repos:{getContent:async()=>({data:{type:'file',encoding:'base64',size:64,content:Buffer.from('export const sum = (a: number, b: number) => a + b;').toString('base64')}})}}};
            const answer=await respondToInline({github:fakeGithub,context:{repo:{owner:'synthetic',repo:'test'},payload:{action:'created',pull_request:pr,comment:reply}},env:{REVIEW_BOT_LOGIN:BOT,OPENROUTER_API_KEY:process.env.OPENROUTER_API_KEY},fetchImpl});
            assert.ok(answer.usage.measuredCalls > 0, 'No completed conversation model call');
            assert.equal(posted.length,1, 'Conversation did not produce a reply');
            assert.match(answer.decision,/^(maintain|correct|not_applicable)$/,'Conversation fell back to needs_context');
            core.info(`Real inline conversation: ${answer.decision}, calls ${answer.calls}, reply validated without publishing to GitHub`);
            await core.summary.addHeading('OpenRouter real smoke test').addTable([{data:'Flow',header:true},{data:'Result',header:true}].length ? [['Flow','Result'],['Chunk review',`PASS: ${report.coverage}, ${report.score}/5`],['Inline conversation',`PASS: ${answer.decision}`],['Model',MODEL],['Endpoint',ENDPOINT],['Total HTTP calls',String(httpCalls)],['Credentials','GitHub Actions secret only; not printed']] : []).write();
