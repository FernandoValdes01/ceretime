name: Notificaciones HoloNet

on:
  pull_request_target:
    types: [review_requested, closed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  notify:
    if: >-
      (github.event_name == 'pull_request_target' &&
       (github.event.action == 'review_requested' && github.event.requested_reviewer != null ||
        github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')) ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested' &&
       github.event.review.user.type != 'Bot' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Never check out the PR head or merge commit, even for review events.
      - name: Descargar código confiable de main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: FernandoValdes01/ceretime
          ref: refs/heads/main
          persist-credentials: false
          sparse-checkout: .github/discord
          sparse-checkout-cone-mode: false

      - name: Instalar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Publicar notificación
        run: bun .github/discord/notify.ts
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
