name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.action == 'edited' && !github.event.changes.base && github.run_id || 'validation' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint y formato
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Ejecutar Oxlint
        run: bun run lint

      - name: Comprobar formato con Oxfmt
        run: bun run format:check

      - name: Probar publicación de resultados de CI
        run: bun test ./.github/ci-publication.test.ts

  mobile:
    name: Validación Mobile
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Verificar tipos de Mobile
        run: bun run --cwd apps/mobile typecheck

      - name: Ejecutar pruebas de Mobile
        run: bun run --cwd apps/mobile test

  web:
    name: Validación Web
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Ejecutar lint existente de Web
        run: bun run --cwd apps/web lint

      - name: Ejecutar pruebas de Web
        run: bun run test:web

      - name: Construir Web
        run: bun run --cwd apps/web build

  backend:
    name: Verificación Backend
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Verificar tipos de Convex
        run: bun run --cwd apps/web tsc -p ../../convex/tsconfig.json --noEmit

      - name: Verificar tipos de las pruebas de Convex
        run: bun run --cwd apps/web tsc -p ../../convex/tsconfig.tests.json --noEmit

      - name: Ejecutar pruebas del backend
        run: bun run test:convex

  vercel-preview:
    name: Desplegar Web Preview
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'synchronize' ||
       github.event.action == 'reopened' || github.event.action == 'ready_for_review' ||
       (github.event.action == 'edited' && github.event.changes.base)) &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs:
      - lint-and-format
      - mobile
      - web
      - backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: vercel-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Registrar el commit construido
        id: checkout-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Instalar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Obtener configuración Preview de Vercel
        run: vercel pull --yes --environment=preview --git-branch="$GITHUB_HEAD_REF" --token="$VERCEL_TOKEN"

      - name: Construir Web Preview
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Desplegar Web Preview
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar URL de Preview en la PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PREVIEW_BUILD_SHA: ${{ steps.checkout-sha.outputs.sha }}
        with:
          script: |
            const marker = '<!-- ceretime-vercel-preview -->';
            const body = `${marker}\nPreview Web: ${process.env.PREVIEW_URL}\n\nCommit de la PR: ${process.env.PR_HEAD_SHA}\nCommit construido: ${process.env.PREVIEW_BUILD_SHA}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (pr.state !== 'open' || pr.head.sha !== process.env.PR_HEAD_SHA ||
                pr.base.sha !== process.env.PR_BASE_SHA || pr.base.ref !== process.env.PR_BASE_REF) {
              core.info('Preview obsoleto: se conserva el comentario vigente.');
              return;
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const { data: latest } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (latest.state !== 'open' || latest.head.sha !== process.env.PR_HEAD_SHA ||
                latest.base.sha !== process.env.PR_BASE_SHA || latest.base.ref !== process.env.PR_BASE_REF) {
              core.info('La PR cambió durante la publicación de Preview.');
              return;
            }
            const previous = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  vercel-production:
    name: Desplegar Web Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - lint-and-format
      - mobile
      - web
      - backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Obtener configuración Production de Vercel
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Construir Web Production
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Comprobar que Production corresponde al main vigente
        id: production-target
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { data: ref } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            const current = ref.object.sha === context.sha;
            if (!current) core.summary.addRaw('Production omitida: este run valida un commit anterior de main.').write();
            return current;

      - name: Desplegar Web Production
        if: steps.production-target.outputs.result == 'true'
        run: |
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "Production: $url" >> "$GITHUB_STEP_SUMMARY"
