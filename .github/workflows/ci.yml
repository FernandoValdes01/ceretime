name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_builds:
        description: Ejecutar los builds reales preparados para TI4-34
        required: true
        type: boolean
        default: false
      pr_number:
        description: Número de PR al que se publicará el resultado, si corresponde
        required: false
        type: string

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint y formato
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Ejecutar Oxlint
        run: bun run lint

      - name: Comprobar formato con Oxfmt
        run: bun run format:check

  mobile:
    name: Validación Mobile
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Verificar tipos de Mobile
        run: bun run --cwd apps/mobile typecheck

      - name: Ejecutar pruebas de Mobile
        run: bun run --cwd apps/mobile test

  web:
    name: Validación Web
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Ejecutar lint existente de Web
        run: bun run --cwd apps/web lint

      - name: Construir Web
        run: bun run --cwd apps/web build

  backend:
    name: Verificación Backend
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Verificar tipos de Convex
        run: bun run --cwd apps/web tsc -p ../../convex/tsconfig.json --noEmit

      - name: Verificar tipos de las pruebas de Convex
        run: bun run --cwd apps/web tsc -p ../../convex/tsconfig.tests.json --noEmit

      - name: Ejecutar pruebas del backend
        run: bun run test:convex

  builds:
    name: Build ${{ matrix.component }} (TI4-34)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_builds }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - web
          - mobile
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Construir Web
        if: ${{ matrix.component == 'web' }}
        run: bun run --cwd apps/web build

      - name: Exportar Mobile
        if: ${{ matrix.component == 'mobile' }}
        run: bun run --cwd apps/mobile export

      - name: Publicar resultado del build
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-${{ matrix.component }}-${{ github.run_id }}
          path: apps/${{ matrix.component }}/dist
          if-no-files-found: warn
          retention-days: 7

      - name: Publicar resumen en el check
        if: ${{ always() }}
        env:
          COMPONENT: ${{ matrix.component }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$COMPONENT" in
            web) command='bun run --cwd apps/web build' ;;
            mobile) command='bun run --cwd apps/mobile export' ;;
          esac

          {
            echo "## Build $COMPONENT"
            echo
            echo "Resultado: **$JOB_STATUS**"
            echo
            echo "Comando: \`$command\`"
            echo
            echo "[Ver logs y artefactos del run]($RUN_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-pr-result:
    name: Publicar resultado en PR
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_builds && inputs.pr_number != '' }}
    needs: builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Validar PR y publicar comentario
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          RUN_RESULT: ${{ needs.builds.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_REF: ${{ github.ref }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber < 1) {
              core.setFailed('pr_number debe ser un número entero positivo.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });
            const repository = `${owner}/${repo}`;
            const expectedRef = `refs/heads/${pullRequest.head.ref}`;
            if (pullRequest.head.repo?.full_name !== repository || process.env.WORKFLOW_REF !== expectedRef) {
              core.setFailed('La rama del workflow no coincide con la rama de la PR indicada.');
              return;
            }

            const marker = '<!-- ceretime-ci-build-result -->';
            const body = [
              marker,
              '## Resultado de builds preparados para TI4-34',
              '',
              `Estado: **${process.env.RUN_RESULT}**`,
              '',
              `[Ver logs, resumen y artefactos del run](${process.env.RUN_URL})`,
              '',
              'El comentario se actualiza en cada ejecución manual asociada a esta PR.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const previous = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
            }
