name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint y formato
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Ejecutar Oxlint
        run: bun run lint

      - name: Comprobar formato con Oxfmt
        run: bun run format:check

      - name: Probar publicación de resultados de CI
        run: bun test ./.github/ci-publication.test.ts

      - name: Probar lectura de la nota de Greptile
        run: bun test ./.github/greptile-score.test.ts

  greptile_score:
    name: Greptile 5/5
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: greptile-score-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      issues: read
      pull-requests: read
    steps:
      - name: Esperar y validar la nota del commit actual
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const pullNumber = context.payload.pull_request?.number;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            const headSha = pullRequest.head.sha.toLowerCase();
            const deadline = Date.now() + 10 * 60 * 1000;
            let summary;
            let score;
            let reviewedSha;

            do {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                per_page: 100,
              });
              summary = comments
                .filter((comment) =>
                  comment.user?.login === 'greptile-apps[bot]' &&
                  comment.user?.type === 'Bot' &&
                  comment.body?.includes('<!-- greptile_summary -->'),
                )
                .sort((a, b) => Date.parse(b.updated_at) - Date.parse(a.updated_at))[0];
              const body = summary?.body ?? '';
              score = body.match(/Confidence Score:\s*([0-5])\/5\b/)?.[1];
              reviewedSha = body.match(/Last reviewed commit:[\s\S]*?\/commit\/([0-9a-f]{40})\b/i)?.[1]?.toLowerCase();

              if (reviewedSha === headSha || Date.now() >= deadline) {
                break;
              }

              await new Promise((resolve) => setTimeout(resolve, 20_000));
            } while (Date.now() < deadline);

            if (reviewedSha !== headSha) {
              core.setFailed('Falta la revisión de Greptile para el commit actual.');
            } else if (score !== '5') {
              const message = score
                ? `Oye, Greptile dice ${score}/5; no puedes mergear así.`
                : 'Greptile no publicó una nota válida para el commit actual; no puedes mergear así.';
              core.setFailed(message);
            } else {
              core.info('Greptile dice 5/5 para el commit actual; puedes mergear.');
            }

  mobile:
    name: Validación Mobile
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Verificar tipos de Mobile
        run: bun run --cwd apps/mobile typecheck

      - name: Ejecutar pruebas de Mobile
        run: bun run --cwd apps/mobile test

  web:
    name: Validación Web
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Ejecutar lint existente de Web
        run: bun run --cwd apps/web lint

      - name: Construir Web
        run: bun run --cwd apps/web build

  backend:
    name: Verificación Backend
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Verificar tipos de Convex
        run: bun run --cwd apps/web tsc -p ../../convex/tsconfig.json --noEmit

      - name: Verificar tipos de las pruebas de Convex
        run: bun run --cwd apps/web tsc -p ../../convex/tsconfig.tests.json --noEmit

      - name: Ejecutar pruebas del backend
        run: bun run test:convex
