name: Validación de builds

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Número de PR al que se publicará el resultado
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  builds:
    name: Build ${{ matrix.component }} (TI4-34)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - web
          - mobile
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Ejecutar build del componente
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          case "$COMPONENT" in
            web) bun run --cwd apps/web build ;;
            mobile) bun run --cwd apps/mobile export ;;
            *) echo "Componente no soportado: $COMPONENT"; exit 1 ;;
          esac

      - name: Publicar resultado del build
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-build-${{ matrix.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/${{ matrix.component }}/dist
          if-no-files-found: error
          retention-days: 7

      - name: Publicar resumen en el check
        if: ${{ always() }}
        env:
          COMPONENT: ${{ matrix.component }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$COMPONENT" in
            web) command='bun run --cwd apps/web build' ;;
            mobile) command='bun run --cwd apps/mobile export' ;;
          esac

          {
            echo "## Build $COMPONENT"
            echo
            echo "Resultado: **$JOB_STATUS**"
            echo
            echo "Comando: \`$command\`"
            echo
            echo "[Ver logs y artefactos del run]($RUN_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-pr-result:
    name: Publicar resultado en PR
    if: ${{ always() }}
    needs: builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Validar PR y publicar comentario
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          RUN_RESULT: ${{ needs.builds.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_REF: ${{ github.ref }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber < 1) {
              core.setFailed('pr_number debe ser un número entero positivo.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });
            const repository = `${owner}/${repo}`;
            const expectedRef = `refs/heads/${pullRequest.head.ref}`;
            if (pullRequest.head.repo?.full_name !== repository || process.env.WORKFLOW_REF !== expectedRef) {
              core.setFailed('La rama del workflow no coincide con la rama de la PR indicada.');
              return;
            }
            if (pullRequest.head.sha !== context.sha) {
              core.setFailed('El commit del run no coincide con el head actual de la PR. Ejecuta el workflow sobre el nuevo commit.');
              return;
            }

            const marker = '<!-- ceretime-ci-build-result -->';
            const body = [
              marker,
              '## Resultado de builds preparados para TI4-34',
              '',
              `Estado: **${process.env.RUN_RESULT}**`,
              '',
              `Commit validado: ${context.sha}`,
              '',
              `[Ver logs, resumen y artefactos del run](${process.env.RUN_URL})`,
              '',
              'El comentario se actualiza en cada ejecución manual asociada a esta PR.',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const previous = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
            }
