name: Nota de Greptile

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  issue_comment:
    types:
      - created
      - edited
      - deleted

permissions:
  contents: read

jobs:
  score:
    name: Publicar nota de Greptile
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - name: Comprobar nota del commit actual
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            if (context.eventName === 'issue_comment') {
              if (!context.payload.issue?.pull_request ||
                  context.payload.comment?.user?.login !== 'greptile-apps[bot]') {
                return;
              }
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request?.number ?? context.payload.issue?.number;
            const { data: pullRequest } = await github.rest.pulls.get({ owner, repo, pull_number });
            if (pullRequest.base.ref !== 'main' || pullRequest.state !== 'open') {
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pull_number,
              per_page: 100,
            });
            const summary = comments
              .filter((comment) =>
                comment.user?.login === 'greptile-apps[bot]' &&
                comment.user?.type === 'Bot' &&
                comment.body?.includes('<!-- greptile_summary -->'),
              )
              .sort((a, b) => Date.parse(b.updated_at) - Date.parse(a.updated_at))[0];
            const body = summary?.body ?? '';
            const score = body.match(/Confidence Score:\s*([0-5])\/5\b/)?.[1];
            const reviewedSha = body.match(/Last reviewed commit:[\s\S]*?\/commit\/([0-9a-f]{40})\b/i)?.[1];
            const current = reviewedSha?.toLowerCase() === pullRequest.head.sha.toLowerCase();
            const passed = current && score === '5';
            const description = !summary
              ? 'Falta la revisión de Greptile para este commit.'
              : !current
                ? 'La revisión de Greptile no corresponde al commit actual.'
                : score
                  ? `Greptile asignó ${score}/5; se exige 5/5.`
                  : 'La revisión de Greptile no contiene una nota válida.';

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: pullRequest.head.sha,
              context: 'Greptile 5/5',
              state: passed ? 'success' : 'failure',
              description,
              target_url: summary?.html_url ?? pullRequest.html_url,
            });
            core.info(description);
